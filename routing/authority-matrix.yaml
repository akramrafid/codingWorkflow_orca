# Orca Authority Matrix
# Comprehensive governance specification for permissions, delegations, approvals, veto powers, and review gates across all 29 agents.

version: "1.0.0"
system: "Orca Agent Operating System"
total_agents: 29

agents:
  requirement-analyzer:
    role_type: "research_design_support"
    can_modify_production_code: false
    can_delegate_to: []
    escalates_to:
      - "senior-system-architect"
      - "senior-product-manager"
      - "senior-security-engineer"
    approval_authority:
      - "Capability mapping and squad activation recommendations"
    rejection_veto_authority:
      - "Incomplete or ambiguous project prompts"
    required_reviews:
      - "architecture"

  senior-product-manager:
    role_type: "decision_maker"
    can_modify_production_code: false
    can_delegate_to:
      - "ux-researcher"
      - "senior-product-designer"
      - "senior-frontend-engineer"
    escalates_to:
      - "senior-system-architect"
    approval_authority:
      - "Product Requirement Documents (PRDs)"
      - "SEO and Conversion Specifications"
      - "User story acceptance criteria sign-offs"
      - "Scope boundary definitions"
    rejection_veto_authority:
      - "Feature implementations that fail acceptance criteria"
      - "Pages lacking SEO metadata or conversion elements"
    required_reviews: []

  senior-system-architect:
    role_type: "decision_maker"
    can_modify_production_code: false
    can_delegate_to:
      - "senior-system-designer"
      - "senior-database-architect"
      - "senior-cloud-architect"
      - "senior-backend-engineer"
      - "senior-frontend-engineer"
      - "senior-ai-engineer"
    escalates_to:
      - "senior-product-manager"
    approval_authority:
      - "Architecture Decision Records (ADRs)"
      - "System blueprints and service topologies"
      - "Rendering strategies (SSR/SSG/ISR/CSR)"
      - "Caching and CDN topology"
      - "Cross-domain technical proposals"
    rejection_veto_authority:
      - "Unjustified architectural complexity (e.g. unneeded microservices/K8s)"
      - "Changes violating established ADRs or performance response budgets"
    required_reviews: []

  senior-system-designer:
    role_type: "specialist"
    can_modify_production_code: false
    can_delegate_to:
      - "senior-backend-engineer"
      - "senior-frontend-engineer"
    escalates_to:
      - "senior-system-architect"
      - "senior-database-architect"
    approval_authority:
      - "Granular component specifications"
      - "OpenAPI 3.1, GraphQL, and gRPC interface contracts"
      - "State machine and sequence definitions"
    rejection_veto_authority:
      - "API implementations deviating from approved contracts"
    required_reviews:
      - "architecture"

  senior-cloud-architect:
    role_type: "decision_maker"
    can_modify_production_code: false
    can_delegate_to:
      - "senior-devops-engineer"
    escalates_to:
      - "senior-system-architect"
      - "senior-security-engineer"
    approval_authority:
      - "Multi-cloud and hybrid landing zone architectures"
      - "FinOps cost models and resource sizing"
      - "Disaster recovery and multi-region topologies"
    rejection_veto_authority:
      - "Unbudgeted or unoptimized cloud infrastructure footprints"
    required_reviews:
      - "architecture"
      - "security"

  senior-database-architect:
    role_type: "decision_maker"
    can_modify_production_code: true
    can_delegate_to:
      - "senior-backend-engineer"
      - "senior-data-engineer"
    escalates_to:
      - "senior-system-architect"
      - "senior-security-engineer"
    approval_authority:
      - "Database schemas and ERDs"
      - "Migration and rollback scripts"
      - "Vector and relational index configurations"
    rejection_veto_authority:
      - "Destructive or locking database migrations"
      - "Unindexed queries causing full table scans"
    required_reviews:
      - "architecture"
      - "security"
      - "qa"

  senior-security-engineer:
    role_type: "decision_maker"
    can_modify_production_code: true
    can_delegate_to:
      - "senior-backend-engineer"
      - "senior-devops-engineer"
    escalates_to:
      - "senior-system-architect"
    approval_authority:
      - "Threat models (STRIDE) and security architecture"
      - "Authentication, authorization, and cryptographic protocols"
      - "Security clearance for production releases"
    rejection_veto_authority:
      - "Unilateral veto over any release with critical/high CVEs or auth flaws"
      - "Insecure secret management or exposed credentials"
    required_reviews: []

  senior-devops-engineer:
    role_type: "decision_maker"
    can_modify_production_code: true
    can_delegate_to:
      - "senior-cloud-architect"
      - "senior-mlops-engineer"
    escalates_to:
      - "senior-system-architect"
      - "senior-security-engineer"
    approval_authority:
      - "CI/CD pipelines and deployment manifests"
      - "Container configurations and Dockerfiles"
      - "Observability, logging, and metrics setup"
    rejection_veto_authority:
      - "Unapproved or unsafe production deployments"
      - "Broken CI pipelines or unhardened container images"
    required_reviews:
      - "security"
      - "architecture"

  senior-qa-architect:
    role_type: "decision_maker"
    can_modify_production_code: true
    can_delegate_to:
      - "visual-qa"
      - "senior-performance-engineer"
    escalates_to:
      - "senior-system-architect"
    approval_authority:
      - "Master Test Plans and coverage thresholds"
      - "Quality gate sign-offs for PR merge"
      - "Automated test suites (unit, integration, E2E)"
    rejection_veto_authority:
      - "Veto over PR merges when tests fail or coverage is < 80%"
      - "Rejection of broken user journeys or unhandled edge cases"
    required_reviews: []

  senior-performance-engineer:
    role_type: "decision_maker"
    can_modify_production_code: true
    can_delegate_to: []
    escalates_to:
      - "senior-system-architect"
      - "senior-frontend-engineer"
      - "senior-database-architect"
    approval_authority:
      - "Performance budgets and Core Web Vitals targets"
      - "Lighthouse CI configuration and assertions"
      - "Load testing benchmarks and latency SLAs"
    rejection_veto_authority:
      - "Veto over releases failing Lighthouse (Perf < 90, SEO < 95) or p95 > 200ms"
      - "Over-budget bundles (> 200KB gzipped initial)"
    required_reviews:
      - "qa"

  senior-frontend-engineer:
    role_type: "specialist"
    can_modify_production_code: true
    can_delegate_to: []
    escalates_to:
      - "brand-guardian"
      - "visual-qa"
      - "senior-system-designer"
      - "senior-product-manager"
      - "senior-performance-engineer"
    approval_authority:
      - "Frontend component modularity and internal state management"
    rejection_veto_authority:
