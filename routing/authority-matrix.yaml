      - "ux-researcher"
      - "design-researcher"
    escalates_to:
      - "brand-guardian"
      - "senior-product-manager"
      - "senior-frontend-engineer"
    approval_authority:
      - "Information architecture and navigation structures"
      - "Wireframes and interactive user flows"
      - "Design system component taxonomy"
    rejection_veto_authority:
      - "Inconsistent layout structures and confusing interaction flows"
    required_reviews:
      - "brand"

  ui-designer:
    role_type: "specialist"
    can_modify_production_code: true
    can_delegate_to: []
    escalates_to:
      - "brand-guardian"
      - "senior-product-designer"
      - "senior-frontend-engineer"
    approval_authority:
