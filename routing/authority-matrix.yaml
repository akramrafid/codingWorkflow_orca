gates:
  architecture_gate:
    owner: "senior-system-architect"
    mandatory: true
    veto_power: true
    criteria:
      - "All significant architectural decisions documented in ADRs"
      - "Rendering strategy (SSR/SSG/ISR) defined and aligned with SEO"
      - "Caching and CDN topology specified"
      - "System boundaries and interface contracts verified"

  brand_gate:
    owner: "brand-guardian"
    mandatory: true
    veto_power: true
    criteria:
      - "Design is original and aligned with brand guidelines"
      - "Color palette uses curated HSL tokens with WCAG 2.1 AA contrast"
      - "Typography hierarchy is clear (at least 3 distinct levels)"
      - "Conversion readiness verified (dominant CTA above fold, trust signals present)"
      - "Design tokens locked prior to frontend implementation"

  security_gate:
    owner: "senior-security-engineer"
    mandatory: true
    veto_power: true
    criteria:
      - "Zero critical or high severity CVEs in dependencies"
      - "Authentication and RBAC/ABAC authorization implemented and verified"
      - "Input validation enforced server-side on all endpoints"
      - "Security headers (CSP, HSTS, X-Frame-Options) configured"
      - "Zero secrets or credentials exposed in code, logs, or client bundles"

  qa_gate:
    owner: "senior-qa-architect"
    mandatory: true
    veto_power: true
    criteria:
      - "Zero test failures across unit, integration, and E2E suites"
      - "Code coverage meets or exceeds 80% on business logic"
      - "Zero lint errors and zero typecheck errors"
      - "SEO tests passing (titles, meta, single h1, JSON-LD, sitemap)"

  performance_gate:
    owner: "senior-performance-engineer"
    mandatory: true
    veto_power: true
    criteria:
      - "Lighthouse Performance score >= 90 on mobile simulation"
      - "Lighthouse SEO score >= 95 and Accessibility >= 95"
      - "LCP < 2.5s, INP < 200ms, CLS < 0.1, TTFB < 200ms"
      - "Initial JS bundle < 200KB gzipped"
      - "API p95 latency < 200ms under load"

  visual_gate:
    owner: "visual-qa"
    mandatory: true
    veto_power: true
    criteria:
      - "Screenshot audits passing across 375px, 768px, 1280px, and 1920px viewports"
      - "Visual diffs match approved high-fidelity designs"
      - "Dark mode renders legibly without contrast artifacts"
      - "Interactive touch targets >= 44x44px on mobile"

  release_gate:
    owner: "senior-devops-engineer"
    mandatory: true
    veto_power: true
    criteria:
      - "All preceding gates (Architecture, Brand, Security, QA, Performance, Visual) PASSED"
      - "Health check endpoint (/healthz) returning 200"
      - "Zero-downtime deployment strategy (Blue/Green or Canary) verified"
      - "Human confirmation received (unless unattended CI mode explicitly enabled)"
